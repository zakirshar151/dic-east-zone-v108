name: Build DIC Central Windows EXE

on:
  workflow_dispatch:
  push:
    paths:
      - 'dic-central-exe/**'
      - '.github/workflows/build-dic-central-exe.yml'

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: dic-central-exe
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dic-central-exe/package-lock.json
      - name: Install dependencies
        run: npm install
      - name: Build Windows installer
        run: npm run build
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: DIC-East-Zone-Central-Windows
          path: dic-central-exe/dist/*.exe
          if-no-files-found: error
